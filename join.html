<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2; url=https://career5.successfactors.eu/career?company=universitdP&career_job_req_id=22780&career_ns=job_listing&navBarLevel=JOB_SEARCH">
  <link rel="canonical" href="https://career5.successfactors.eu/career?company=universitdP&career_job_req_id=22780&career_ns=job_listing&navBarLevel=JOB_SEARCH">
  <title>Join – Landoni Lab</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a3a3a url('images/Hero.webp') center center / cover no-repeat;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 20, 0.45);
    }

    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 4rem 5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 1.25rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 580px;
      width: 90%;
    }

    .logo {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    .message {
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .message a {
      color: #a8d8a8;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(168, 216, 168, 0.4);
      transition: border-color 0.2s;
    }

    .message a:hover {
      border-color: #a8d8a8;
    }

    .dots {
      display: inline-flex;
      gap: 6px;
      margin-top: 0.25rem;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40%            { opacity: 1;   transform: scale(1);    }
    }

    @media (max-width: 1000px) {
      body {
        background-position: 20% center;
      }

      .card {
        gap: 2.5rem;
        padding: 2.5rem;
        max-width: 90%;
        width: 90%;
        border-radius: 1rem;
      }

      .logo {
        width: 300px;
      }

      .message {
        font-size: 3rem;
        line-height: 1.7;
      }

      .dots span {
        width: 14px;
        height: 14px;
      }

      .dots {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="card">
    <img class="logo" src="icons/SVG/LOGO.svg" alt="Landoni Lab logo">
    <p class="message">
      Redirecting to the<br>
      <a href="https://career5.successfactors.eu/career?company=universitdP&career_job_req_id=22780&career_ns=job_listing&navBarLevel=JOB_SEARCH">UNIL Recruitment System</a>
    </p>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</body>
</html>
